version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - corepack enable
        - corepack pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|CONTACT_|SES_)' >> .env.production || true
        - corepack pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
